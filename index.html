.items{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:1fr 48px;border-bottom:1px solid var(--line)}

.bx{flex:none;width:23px;height:23px;border:2px solid var(--line-2);border-radius:4px;margin-top:1px;

.inf{grid-column:2;display:grid;place-items:center;color:var(--ink-3);min-height:54px}

.dt{grid-column:1/-1;background:var(--surface-2);border-top:1px solid var(--line);

  font-size:.7rem;color:var(--ink-3);margin-top:10px;padding-left:0}
.dl.h:before{display:none}

.cf{display:flex;gap:9px;padding:12px 16px;background:var(--surface-2);border-top:1px solid var(--line);flex-wrap:wrap}

.mini.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.mini.dgr{color:var(--key);border-color:var(--key)}
.note{width:100%;min-height:64px;resize:vertical;padding:11px 12px;border:1px solid var(--line);

.nl{display:block;font-family:var(--fd);font-weight:600;font-size:.72rem;text-transform:uppercase;
  letter-spacing:.12em;color:var(--ink-3);margin:0 0 7px}
.nb{padding:14px 16px}

/* edit mode */
.card.ed{border-color:var(--thr);border-left:3px solid var(--thr)}

.ti{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);

.ei{padding:12px 14px;border-bottom:1px solid var(--line)}
.ei.new{background:var(--accent-soft)}
.eh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.eno{font-family:var(--fm);font-size:.74rem;color:var(--ink-3);min-width:20px}
.ea{width:100%;padding:10px 11px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);
  font-size:.93rem;line-height:1.4;resize:none;overflow:hidden;min-height:44px}
.ea.det{background:var(--surface-2);font-size:.88rem;margin-top:8px;min-height:80px}
.erow{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.eb{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:38px;padding:4px 11px;
  border:1px solid var(--line-2);border-radius:3px;font-family:var(--fd);font-weight:600;font-size:.72rem;
  text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2)}
.eb.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.eb.del{color:var(--key);border-color:var(--key);margin-left:auto}
.ehint{font-size:.8rem;color:var(--ink-3);padding:0 16px 14px}

.dnav{display:flex;gap:8px;margin-bottom:14px}
.dnav button{flex:1;padding:11px;border:1px solid var(--line);border-radius:3px;background:var(--surface);
  font-family:var(--fd);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink-2);min-height:46px}
.dnav button.now{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

.wk{background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-bottom:9px;overflow:hidden}
.wkh{display:flex;align-items:center;gap:10px;width:100%;padding:13px 15px;text-align:left;min-height:56px}
.wkh.cur{background:var(--accent-soft)}
.wkn{font-family:var(--fd);font-weight:700;font-size:1rem;text-transform:uppercase;letter-spacing:.03em}
.wkd{font-family:var(--fm);font-size:.72rem;color:var(--ink-3)}
.ring{margin-left:auto;font-family:var(--fm);font-size:.72rem;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.dots{display:flex;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sunk)}
.dot.f{background:var(--ok)}
.dot.p{background:var(--thr)}
.dot.r{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.chev{color:var(--ink-3);font-size:.8rem;width:12px;text-align:center}
.wkb{border-top:1px solid var(--line)}
.dr{display:flex;align-items:center;gap:10px;width:100%;padding:12px 15px;text-align:left;
  border-bottom:1px solid var(--line);min-height:52px}
.dr:last-child{border-bottom:none}
.dr.gym{box-shadow:inset 3px 0 0 var(--accent)}
.drd{font-family:var(--fd);font-weight:600;font-size:.82rem;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-3);width:34px;flex:none}
.drt{font-size:.9rem;color:var(--ink);flex:1;min-width:0}
.drm{font-family:var(--fd);font-size:.66rem;color:var(--thr);letter-spacing:.1em;text-transform:uppercase}
.drc{font-family:var(--fm);font-size:.72rem;color:var(--ink-3);flex:none}
.drc.done{color:var(--ok);font-weight:600}
.blk{font-family:var(--fd);font-weight:700;font-size:.8rem;text-transform:uppercase;
  letter-spacing:.13em;color:var(--ink-3);margin:22px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}

.sec{margin-bottom:26px}
.sech{font-family:var(--fd);font-weight:700;font-size:1.2rem;text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px}

  border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
td.n{font-family:var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.w td:first-child{color:var(--key);font-weight:600}
tr.tot td{background:var(--surface-2);font-weight:600}
.cue{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:9px}
.cue.w{border-left:3px solid var(--key)}
.cueh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.cuen{font-family:var(--fd);font-weight:600;font-size:1.02rem;text-transform:uppercase;letter-spacing:.02em}
.cuet{font-family:var(--fm);font-size:.76rem;color:var(--accent-ink)}

.rt{background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-bottom:8px;overflow:hidden}
.rth{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:13px 15px;min-height:52px}
.rtn{font-family:var(--fd);font-weight:600;font-size:.98rem;text-transform:uppercase;letter-spacing:.02em;flex:1}
ul.rl{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
ul.rl li{background:var(--surface);padding:12px 15px;font-size:.9rem;color:var(--ink-2);border-bottom:1px solid var(--line)}
ul.rl li:last-child{border-bottom:none}
ul.rl li b{color:var(--ink)}
ol.st{padding-left:20px;margin:0}
ol.st li{margin-bottom:8px;font-size:.9rem;color:var(--ink-2)}
ol.st li b{color:var(--ink)}

.fg{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:13px}
.fld label{display:block;font-family:var(--fd);font-weight:600;font-size:.7rem;text-transform:uppercase;
  letter-spacing:.11em;color:var(--ink-3);margin-bottom:5px}
.fld input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:3px;
  background:var(--surface);font-family:var(--fm);font-size:.95rem;min-height:46px}
.out{background:var(--accent-soft);border-left:3px solid var(--accent);padding:13px 15px;border-radius:0 3px 3px 0}
.out .big{font-family:var(--fm);font-size:1.3rem;font-weight:600;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.out p{margin:5px 0 0;font-size:.85rem;color:var(--ink-2)}
.wrow{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--surface);
  border:1px solid var(--line);border-radius:3px;margin-bottom:6px}
.wrow .d{font-family:var(--fm);font-size:.82rem;color:var(--ink-3);flex:1}
.wrow .v{font-family:var(--fm);font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums}
.wrow .x{color:var(--ink-3);padding:8px 10px;font-size:1.1rem;line-height:1}
.hint{font-size:.82rem;color:var(--ink-3);margin:9px 0 0}

.tb{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--line-2);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tb button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;
  font-family:var(--fd);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink-3);min-height:58px;justify-content:center}
.tb button.on{color:var(--accent-ink)}
.tb .ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9}
.tb button.on .ic{stroke-width:2.4}
.sv{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:39;
  display:flex;justify-content:center;pointer-events:none;padding:0 14px 9px}
.sv button{pointer-events:auto;display:flex;align-items:center;gap:9px;background:var(--accent);color:#fff;
  border-radius:24px;padding:12px 22px;font-family:var(--fd);font-weight:600;font-size:.86rem;
  text-transform:uppercase;letter-spacing:.09em;box-shadow:0 4px 16px rgba(0,0,0,.22);min-height:46px}
.sv button[disabled]{opacity:.65}
.sv.q button{background:var(--surface);color:var(--ink-3);box-shadow:0 2px 10px rgba(0,0,0,.14);border:1px solid var(--line)}
.msg{position:fixed;left:14px;right:14px;bottom:calc(116px + env(safe-area-inset-bottom));z-index:41;
  background:var(--ink);color:var(--bg);padding:12px 15px;border-radius:4px;font-size:.88rem;
  box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:612px;margin:0 auto}
.msg.err{background:var(--key);color:#fff}
.empty{text-align:center;padding:38px 16px;color:var(--ink-3);font-size:.92rem}
</style>
</head>

/* ================= routine library ================= */
var LIB={
mob:{n:'15-minute mobility',b:[
'## Ankles first — they gate everything else',
'Knee-to-wall ankle rock — 2×10 each side. Toes 10 cm from a wall, drive the knee forward to touch it, heel glued down. If the heel lifts, move closer.',
'Eccentric calf lower off a step — 2×12 each leg, 3 seconds down. One set knees straight, one set knees soft. The soft-knee set hits the soleus, which is what causes the shin and Achilles pain of coming back to running.',
'Wall calf stretch — 30 s each side straight knee, then 30 s with the knee bent.',
'## Hips',
'90/90 seated switch — 10 slow switches. Both knees at 90°, rotate side to side, chest tall.',
'Couch stretch — 60 s each side. Back foot elevated, and squeeze the back glute hard; that squeeze is what makes it work.',
'Adductor rock-back — 10 each side. Hands down, one leg straight out to the side, rock the hips back.',
'## Switch-on',
'Glute bridge — 2×12 with a 2-second squeeze at the top.',
'World’s greatest stretch — 5 each side, slow.',
'## Rule',
'Ache in the muscle is fine. Sharp or pinching pain inside a joint is not — back off that movement, and see a physio if it persists.']},

wugym:{n:'Gym warm-up — 10 minutes',b:[
'5 min bike, row or ski at Z1 — easy enough to hold a conversation.',
'Ankle circles 10 each way, hip circles 10 each way.',
'Bodyweight squat ×15, glute bridge ×15.',
'Walking lunge 10 steps each leg.',
'Band pull-apart ×15 and band external rotation ×12 each side — cheap insurance against the ski and wall ball volume.',
'Sled push 2×12.5 m at about half your working load, purely to find the body position before it gets heavy.',
'## Why the sled goes last',
'You want the position grooved and the tissue warm before the first heavy set, not after it.']},

wurun:{n:'Run warm-up — 15 minutes, do not skip it',b:[
'10 min very easy jog. Slower than feels right.',
'Leg swings — 10 front-to-back and 10 side-to-side each leg.',
'Walking knee hug ×10, walking lunge ×10, ankle bounces ×20.',
'A-skips 2×20 m, then high knees 2×20 m.',
'4×20 s strides, each building to about threshold pace, 40 s easy walk between.',
'Start the first interval within two minutes of the last stride.',
'## Why it matters',
'Threshold work on cold legs is how you run the first rep 15 s/km too fast and the last one 20 s/km too slow.']},

cd:{n:'Cool-down — 8 minutes',b:[
'5 min walk or very easy spin, until your breathing is fully normal.',
'Wall calf stretch 30 s each side.',
'Couch stretch 45 s each side.',
'Figure-4 glute stretch 45 s each side.',
'Skip this on a rushed day if you must — but never after a sled session. That is the one that leaves your calves and hip flexors short.']},

easy:{n:'How to run the easy and long runs',b:[
'Conversational the whole way. You should be able to speak a full sentence without gasping — roughly 6:00–6:45/km early in the plan.',
'If in doubt, slower. These runs build the base that lets Tuesday and Saturday land; running them at "medium" ruins both ends.',
'Nasal breathing is a decent gauge — if you have to open your mouth to keep up, you are going too fast.',
'Where a session says "last X km at pace", every kilometre before it is still genuinely easy.',
'Walk breaks in Block 1 are fine and not a failure.']},

thr:{n:'What low Zone 4 actually feels like',b:[
'Comfortably hard. You can speak three or four words, not a sentence.',
'RPE 7 to 7.5 on the first rep, drifting to 8 by the last. If rep 1 already feels like an 8, the pace is too fast.',
'By heart rate: about 88–92% of the highest heart rate you saw in your 5 km time trial.',
'It should feel repeatable — like you could hold it for an hour if you had to, even though you would rather not.',
'## When to stop',
'If your pace drifts more than 10 s/km off target and will not come back, end the session there. A session held together by willpower trains fatigue, not fitness.']},

push:{n:'Sled push — 152 kg',b:[
'Hands or forearms high on the uprights, arms straight and LOCKED. Bent arms turn it into a bench press.',
'Hips low, torso around 45°, head neutral — one long line from hands to hips.',
'Short choppy steps, driving through the ball of the foot. Long strides stall the sled.',
'Continuous pressure. Once it stops moving, restarting costs far more than never stopping did.',
'## In the race',
'Four lanes of 12.5 m. Two pauses per lane maximum, and none at all on lanes 3 and 4 — those decide your split.',
'Bodyweight genuinely helps here, which is why sled work stays in the plan while you lose weight.']},

pull:{n:'Sled pull — 103 kg',b:[
'Sit your weight back and DOWN into the rope, near enough a squat. Let bodyweight do the work, not your arms.',
'Hand over hand with long deliberate pulls. Short frantic pulls burn your grip and move the sled less.',
'Keep the rope low and close, elbows driving past your ribs.',
'Heels planted, not up on your toes.',
'## Free time',
'Jog back to the line every lane instead of walking. Across four lanes that is 20–30 seconds for no extra fitness — the cheapest time in the race.']},

burpee:{n:'Burpee broad jump — 80 m',b:[
'A distance problem disguised as a fitness problem. At 1.3 m per rep it is 62 reps; at 1.0 m it is 80. Those 18 extra burpees cost about 90 seconds.',
'STEP UP out of the burpee rather than jumping your feet in. Over 60 reps it saves a surprising amount of heart rate.',
'Chest to floor, hands past your feet, then a committed two-footed jump with an arm swing.',
'Land soft, absorb through the hips, straight into the next rep.',
'## Pacing',
'A steady unbroken rhythm beats fast-then-stopping every time. Pick a cadence you could hold for all 80 m and hold it.',
'Measure your broad jump in training so on race day you know how many reps you are committing to.']},

lunge:{n:'Lunge technique',b:[
'Sandbag high on the traps, not the neck. Hold the front corners, elbows down.',
'Trailing knee touches the floor every rep — that is the race standard and judges do watch it.',
'Front shin close to vertical, torso upright. Leaning forward dumps it all on your quads.',
'Breathe every single rep. Holding your breath is why people fail this station.',
'## Pacing in the race',
'One planned break at 50 m and no unplanned ones. Break twice and run 8 falls apart.',
'It arrives at roughly 62 minutes with a full kilometre still to run — pace it like there is more to come, because there is.']},

wb:{n:'Wall balls — 6 kg to 10 ft',b:[
'Catch the ball in the squat, not standing up. Let it drop into the next rep — the catch IS the descent.',
'Hips below the knee crease at the bottom, ball hits the centre of the target at the top.',
'Aim at the middle, not the edge. A no-rep costs far more than a breath does.',
'Elbows in, drive through the legs. This is a squat that throws, not a shoulder press.',
'## Pacing',
'25 / 25 / 25 / 25 with about 10 seconds between sets. Do not go unbroken and blow up at rep 60.']},

farmers:{n:'Farmers carry — 2×24 kg, 200 m',b:[
'Unbroken. This is where a mid-pack athlete banks real time.',
'Shoulders back and down, ribs stacked over hips, short quick steps.',
'Tight turns — swing wide and you add metres you then have to carry.',
'Grip is the limiter, not legs. If your hands start to go, hook grip the handles and keep moving.']},

ski:{n:'SkiErg — 1000 m',b:[
'Hinge at the hips and drive down with the whole torso, finishing with hands past the hips.',
'Arms follow the body, they do not lead. Keep the legs mostly out of it — you need them later.',
'Target around 1:07 per 500 m for sub-1:25 pace.',
'Long relaxed strokes at a lower rate beat short frantic ones.']},

row:{n:'Row — 1000 m',b:[
'Legs, then back, then arms on the drive. Reverse the order on the recovery.',
'Target about 2:10 per 500 m, stroke rate 24–26.',
'The only genuine recovery station in the race — use it to bring your heart rate down before the back half.',
'Push the footplate away, do not pull with your arms.']},

squat:{n:'Squat guidance',b:[
'Block 2 only. From week 8 the sled replaces the barbell entirely.',
'RPE 7–8 means leaving 2–3 reps in the tank. Never grind to failure — you are training for a race, not a total.',
'Full depth if your ankles allow it. The mobility work is what buys that depth.',
'If it feels heavy on the day, drop 10% and keep the reps. Consistency beats load here.']},

hinge:{n:'Deadlift and RDL guidance',b:[
'Neutral spine, weight close to the legs, hips driving the movement.',
'RDLs: soft knees, push the hips back, and stop when your hamstrings say so rather than chasing the floor.',
'These protect your hamstrings and low back against 100 m of loaded lunges. Do not skip them in Block 2.',
'Leave 2–3 reps in reserve on every set.']},

core:{n:'Core circuit — 3 rounds',b:[
'Dead bug — 8 each side, slow, low back pressed flat into the floor.',
'Side plank — 30 s each side, hips stacked and lifted.',
'Hollow hold — 20–30 s, ribs down.',
'Bird dog — 8 each side, no rotation through the hips.',
'The point is anti-rotation and anti-extension — what holds your form together on the lunges and the back half of the run.']},

fuel:{n:'Session fuelling',b:[
'Eat 90 minutes before any key session: something you have eaten before, carb-led, low fibre.',
'Never run threshold or Saturday sessions fasted, even in the deficit weeks.',
'From week 8, use the exact breakfast and gels you intend to use on race day. Race day gets no new foods.',
'Water with electrolyte for anything over an hour.']}
};

(function build(){
  for(var w=0;w<PLAN.length;w++){
    var days=PLAN[w].days;
    for(var d=0;d<days.length;d++){
      var day=days[d], base=w+'-'+d, out=[];
      for(var i=0;i<day.x.length;i++){
        var txt=day.x[i], r=null;
        for(var m=0;m<MATCH.length;m++){ if(MATCH[m][0].test(txt)){r=MATCH[m][1];break} }
        out.push(r?{id:base+'-'+i,t:txt,r:r}:{id:base+'-'+i,t:txt});
      }
      if(day.g) out.unshift({id:base+'-wu',t:'Warm-up — 10 min',r:'wugym'});
      else if(day.t==='thr'||day.t==='test') out.unshift({id:base+'-wu',t:'Warm-up — 15 min',r:'wurun'});
      if(day.t==='thr'||day.t==='key'||day.t==='test'||day.t==='sled') out.push({id:base+'-cd',t:'Cool-down — 8 min',r:'cd'});
      day.x=out;
      if(DAYDET[day.t]) day.dr=DAYDET[day.t];
    }
  }
})();

/* ================= dates ================= */
var DAY=86400000;
function parseD(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])}
function todayUTC(){var d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())}
function daysToRace(){return Math.round((parseD(RACE)-todayUTC())/DAY)}
function nowPos(){
  var off=Math.floor((todayUTC()-parseD(START))/DAY);
  if(off<0) return {w:0,d:0};
  var w=Math.floor(off/7), d=off%7;
  if(w>14) return {w:14,d:6};
  return {w:w,d:d};
}
function focusPos(){return ui.focus||nowPos()}
function dateOf(w,d){
  return new Date(parseD(START)+(w*7+d)*DAY)
    .toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short',timeZone:'UTC'});
}

/* ================= plan access (default + overrides) ================= */
function nDays(w){return PLAN[w].days.length}
function baseDay(w,d){var ds=PLAN[w].days;return ds[Math.min(d,ds.length-1)]}
function ovKey(w,d){return w+'-'+d}
function dayOf(w,d){
  var b=baseDay(w,d), ov=state.plan&&state.plan[ovKey(w,d)];
  if(!ov) return b;
  return {d:b.d,t:b.t,g:b.g,dr:b.dr,ti:(ov.ti!=null?ov.ti:b.ti),x:ov.x||b.x,ed:1};
}
function isEdited(w,d){return !!(state.plan&&state.plan[ovKey(w,d)])}
function ensureOv(w,d){
  var k=ovKey(w,d);
  if(!state.plan) state.plan={};
  if(!state.plan[k]){var cur=dayOf(w,d);state.plan[k]={ti:cur.ti,x:clone(cur.x)}}
  return state.plan[k];
}
function findIdx(arr,id){for(var i=0;i<arr.length;i++) if(arr[i].id===id) return i;return -1}
function newId(){seq++;return 'n'+Date.now().toString(36)+seq}

function dayCount(w,d){
  var x=dayOf(w,d).x,c=0;
  for(var i=0;i<x.length;i++) if(state.done[x[i].id]) c++;
  return {c:c,t:x.length};
}
function dayFull(w,d){var r=dayCount(w,d);return r.t>0&&r.c===r.t}
function weekCount(w){var c=0,t=0;for(var d=0;d<nDays(w);d++){var r=dayCount(w,d);c+=r.c;t+=r.t}return {c:c,t:t}}
function totalCount(){var c=0,t=0;for(var w=0;w<PLAN.length;w++){var r=weekCount(w);c+=r.c;t+=r.t}return {c:c,t:t}}
function sessionsDone(){var n=0;for(var w=0;w<PLAN.length;w++)for(var d=0;d<nDays(w);d++)if(dayFull(w,d))n++;return n}
function editCount(){var n=0,p=state.plan||{};for(var k in p) if(p.hasOwnProperty(k)) n++;return n}

/* ================= paces ================= */
function toSec(s){
  if(!s) return 0;
  var p=String(s).trim().split(':').map(Number);
  if(p.some(isNaN)) return 0;
  if(p.length===3) return p[0]*3600+p[1]*60+p[2];
  if(p.length===2) return p[0]*60+p[1];
  return p[0];
}
function mmss(n){n=Math.round(n);var m=Math.floor(n/60),s=n%60;return m+':'+(s<10?'0':'')+s}
function paces(){
  var s=toSec(state.tests.t5k); if(!s) return null;
  var per=s/5;
  return {tt:mmss(s),k:mmss(per),lo:mmss(per+20),hi:mmss(per+25)};
}

  h+='<div class="sec"><h2 class="sech">Progress</h2><ul class="rl">'
   +'<li><b>'+sessionsDone()+' of '+(15*7)+'</b> sessions completed</li>'
   +'<li><b>'+tot.c+' of '+tot.t+'</b> individual items ticked</li>'
   +'<li><b>'+Math.max(0,daysToRace())+' days</b> until Hyrox London</li>'
   +'</ul></div>';

  h+='<div class="sec"><h2 class="sech">Your plan edits</h2>'
   +'<p class="secs">Sessions you have changed are kept separately, so they survive any update to the programme.</p>'
   +'<ul class="rl"><li><b>'+ec+'</b> session'+(ec===1?'':'s')+' edited</li></ul>';
  if(ec) h+='<div style="margin-top:11px"><button class="mini dgr" data-resetall="1">Reset every edit to the plan</button></div>';
  h+='</div>';

  h+='<div class="sec"><h2 class="sech">Saving</h2><ul class="rl"><li>'
   +(ui.ro?'This view is <b>read-only</b> — changes stay on this device only.'
     :'Changes are kept on this device instantly and saved to the app when you tap <b>Save</b>. '
      +(ui.mode==='files'?'Saving does not interrupt your session.':ui.mode==='html'?'Saving reloads the page.':''))
   +'</li></ul></div>';
  return h;
}

function tabs(){
  var T=[['today','Today',ICO.today],['plan','Plan',ICO.plan],['ref','Reference',ICO.ref],['log','Log',ICO.log]];
  var h='<nav class="tb">';
  for(var i=0;i<T.length;i++)
    h+='<button data-tab="'+T[i][0]+'" class="'+(ui.tab===T[i][0]?'on':'')+'">'
     +icon(T[i][2])+'<span>'+T[i][1]+'</span></button>';
  return h+'</nav>';
}
function saveBar(){
  if(ui.ro) return '';
  if(ui.saving) return '<div class="sv"><button disabled>Saving…</button></div>';
  if(!dirty) return '<div class="sv q"><button data-save="1">All saved</button></div>';
  return '<div class="sv"><button data-save="1">Save progress</button></div>';
}
function toast(){return ui.msg?'<div class="msg'+(ui.msg.e?' err':'')+'">'+esc(ui.msg.t)+'</div>':''}

function render(){
  var body=ui.tab==='today'?viewToday():ui.tab==='plan'?viewPlan():ui.tab==='ref'?viewRef():viewLog();
  root.innerHTML='<div class="shell">'+head()+body+'</div>'+saveBar()+tabs()+toast();
  autosize();
}
function autosize(){
  var t=root.querySelectorAll('textarea.ea');
  for(var i=0;i<t.length;i++){t[i].style.height='auto';t[i].style.height=(t[i].scrollHeight+2)+'px'}
}

/* ================= interaction ================= */
function mark(){dirty=true;mirror()}
function mirror(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function flash(t,e){ui.msg={t:t,e:!!e};render();setTimeout(function(){ui.msg=null;render()},e?4600:2200)}
function refreshSave(){var sv=root.querySelector('.sv');if(sv)sv.outerHTML=saveBar()}
function bumpBar(){
  var tot=totalCount(), pct=tot.t?Math.round(tot.c/tot.t*100):0;
  var b=root.querySelector('.bar i'), l=root.querySelector('.barlab');
  if(b) b.style.width=pct+'%';
  if(l&&l.lastElementChild) l.lastElementChild.textContent=sessionsDone()+' sessions · '+pct+'%';
}
function splitK(k){var p=k.split('-');return {w:+p[0],d:+p[1]}}

root.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-item],[data-det],[data-sesd],[data-all],[data-tab],[data-nav],[data-wk],[data-day],[data-save],[data-addw],[data-delw],[data-rt],[data-edit],[data-edone],[data-ereset],[data-eadd],[data-edel],[data-eup],[data-edn],[data-edet],[data-resetall]');
  if(!el) return;
  var v;

  if(v=el.getAttribute('data-item')){
    if(state.done[v]) delete state.done[v]; else state.done[v]=1;
    mark();
    var li=el.parentNode;
    li.classList.toggle('on'); el.setAttribute('aria-pressed',li.classList.contains('on'));
    var card=li.closest('.card'), ab=card&&card.querySelector('[data-all]');
    if(ab){
      var q=splitK(ab.getAttribute('data-all')), fu=dayFull(q.w,q.d);
      ab.textContent=fu?'Clear session':'Tick all';
      ab.className='mini'+(fu?'':' pri');
    }
    bumpBar(); refreshSave(); return;
  }
  if(v=el.getAttribute('data-det')){ui.det[v]=!ui.det[v];render();return}
  if(v=el.getAttribute('data-sesd')){ui.sesd[v]=!ui.sesd[v];render();return}
  if(v=el.getAttribute('data-rt')){ui.rt[v]=!ui.rt[v];render();return}
  if(v=el.getAttribute('data-all')){
    var a=splitK(v), day=dayOf(a.w,a.d), fu=dayFull(a.w,a.d);
    for(var i=0;i<day.x.length;i++){
      if(fu) delete state.done[day.x[i].id]; else state.done[day.x[i].id]=1;
    }
    mark(); render(); return;
  }
  if(v=el.getAttribute('data-tab')){ui.tab=v;ui.edit=null;window.scrollTo(0,0);render();return}
  if(v=el.getAttribute('data-nav')){
    var n=+v;
    if(n===0) ui.focus=null;
    else{
      var p=focusPos(), off=p.w*7+p.d+n;
      if(off<0) off=0; if(off>104) off=104;
      ui.focus={w:Math.floor(off/7),d:off%7};
      var nw=nowPos(); if(ui.focus.w===nw.w&&ui.focus.d===nw.d) ui.focus=null;
    }
    ui.edit=null; render(); return;
  }
  if(v=el.getAttribute('data-wk')){ui.open[+v]=!ui.open[+v];render();return}
  if(v=el.getAttribute('data-day')){
    var q2=splitK(v); ui.focus={w:q2.w,d:q2.d};
    var nw2=nowPos(); if(q2.w===nw2.w&&q2.d===nw2.d) ui.focus=null;
    ui.tab='today'; ui.edit=null; window.scrollTo(0,0); render(); return;
  }
  if(el.getAttribute('data-save')){save();return}

  /* ---- editing ---- */
  if(v=el.getAttribute('data-edit')){ui.edit=v;window.scrollTo(0,0);render();return}
  if(el.getAttribute('data-edone')){ui.edit=null;window.scrollTo(0,0);render();return}
  if(v=el.getAttribute('data-ereset')){
    /* ticks live on item ids, and default ids are stable, so they survive a reset */
    delete state.plan[v];
    mark(); render(); flash('Session reset to the plan.'); return;
  }
  if(el.getAttribute('data-resetall')){
    state.plan={}; mark(); render(); flash('All sessions reset to the plan.'); return;
  }
  if(v=el.getAttribute('data-eadd')){
    var ak=splitK(v), ov=ensureOv(ak.w,ak.d);
    ov.x.push({id:newId(),t:''}); mark(); render();
    var tas=root.querySelectorAll('textarea[data-etext]');
    if(tas.length) tas[tas.length-1].focus();
    return;
  }
  if(v=el.getAttribute('data-edel')){
    var ek=splitK(ui.edit), ov2=ensureOv(ek.w,ek.d), ix=findIdx(ov2.x,v);
    if(ix>-1){ov2.x.splice(ix,1);delete state.done[v]}
    mark(); render(); return;
  }
  if(v=el.getAttribute('data-eup')){move(v,-1);return}
  if(v=el.getAttribute('data-edn')){move(v,1);return}
  if(v=el.getAttribute('data-edet')){ui.edet[v]=!ui.edet[v];render();return}
});

function move(id,dir){
  var k=splitK(ui.edit), ov=ensureOv(k.w,k.d), i=findIdx(ov.x,id), j=i+dir;
  if(i<0||j<0||j>=ov.x.length) return;
  var tmp=ov.x[i]; ov.x[i]=ov.x[j]; ov.x[j]=tmp;
  mark(); render();
}

root.addEventListener('input',function(ev){
  var t=ev.target, v;
  if(v=t.getAttribute('data-note')){state.notes[v]=t.value;mark();refreshSave();return}
  if(v=t.getAttribute('data-log')){
    state.tests[v]=t.value.trim(); mark(); refreshSave();
    if(v==='t5k'){var o=document.getElementById('ttout'); if(o) o.innerHTML=paceOut()}
    return;
  }
  if(t.getAttribute('data-tt')){
    state.tests.t5k=t.value.trim(); mark(); refreshSave();
    var o2=document.getElementById('ttout'); if(o2) o2.innerHTML=paceOut(); return;
  }
  if(v=t.getAttribute('data-etitle')){
    var a=splitK(v), ov=ensureOv(a.w,a.d); ov.ti=t.value; mark(); refreshSave(); return;
  }
  if(v=t.getAttribute('data-etext')){
    var b=splitK(ui.edit), ov2=ensureOv(b.w,b.d), i=findIdx(ov2.x,v);
    if(i>-1) ov2.x[i].t=t.value;
    t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px';
    mark(); refreshSave(); return;
  }
  if(v=t.getAttribute('data-edetail')){
    var c=splitK(ui.edit), ov3=ensureOv(c.w,c.d), j=findIdx(ov3.x,v);
    if(j>-1){
      if(t.value.trim()==='') delete ov3.x[j].d; else ov3.x[j].d=t.value;
    }
    t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px';
    mark(); refreshSave(); return;
  }
});

/* ================= persistence ================= */
function fullDoc(st){
  var css=document.getElementById('appcss').textContent;
  var js=document.getElementById('appjs').textContent;
  var close='<'+'/script>';
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'
   +'<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
   +'<title>Hyrox Race Day</title>'+FONTS
   +'<style id="appcss">'+css+'</style></head><body>'
   +'<div id="root"></div>'
   +'<script type="application/json" id="seed">'+JSON.stringify(st).replace(/</g,'\\u003c')+close
   +'<script id="appjs">'+js+close+'</body></html>';
}
function save(){
  if(ui.ro||ui.saving||!dirty) return;
  ui.saving=1; render();
  state.savedAt=Date.now();
  var payload=JSON.stringify(state);
  try{sessionStorage.setItem(LS+'-pending',payload)}catch(e){}
  mirror();
  if(!cap){ui.saving=0;dirty=false;render();flash('Progress saved on this device.');return}
  var files={}; files['data/state.json']=payload;
  cap.publish(files).then(function(){
    ui.saving=0; dirty=false; ui.mode='files';
    try{sessionStorage.removeItem(LS+'-pending')}catch(e){}
    render(); flash('Progress saved.');
  }).catch(function(err){
    var code=err&&err.code;
    if(code==='capability_disabled'||code==='read_only_path'||code==='invalid_content'||code==='transform_error'){
      ui.mode='html';
      cap.publish(fullDoc(state)).then(function(){}).catch(function(e2){failSave(e2)});
      return;
    }
    failSave(err);
  });
}
function failSave(err){
  var code=err&&err.code; ui.saving=0;
  if(code==='not_writer'||code==='not_granted'||code==='not_declared'||code==='consent_required'){
    ui.ro=1; render(); flash('This view is read-only. Progress is kept on this device only.',1); return;
  }
  if(code==='conflict'){render();flash('A newer version was saved elsewhere — reloading.');return}
  if(code==='rate_limited'){render();flash('Saving too often. Wait a moment and tap Save again.',1);return}
  if(code==='too_large'){render();flash('Too much data to save. Trim some session notes.',1);return}
  render(); flash('Could not save. Your progress is kept on this device — try Save again.',1);
}
function pick(a,b){if(!a)return b;if(!b)return a;return (b.savedAt||0)>(a.savedAt||0)?b:a}
function readJSON(s){try{var o=JSON.parse(s);return (o&&typeof o==='object'&&o.v)?o:null}catch(e){return null}}

function boot(){
  ui.open[nowPos().w]=true;
  var best=null, el=document.getElementById('seed');
  if(el) best=pick(best,readJSON(el.textContent));
  try{best=pick(best,readJSON(localStorage.getItem(LS)))}catch(e){}
  try{var pend=readJSON(sessionStorage.getItem(LS+'-pending'));if(pend)best=pick(best,pend)}catch(e){}

  fetch('data/state.json',{cache:'no-store'}).then(function(r){return r.ok?r.text():null})
  .catch(function(){return null}).then(function(txt){
    var f=txt?readJSON(txt):null, win=pick(best,f);
    if(win){
      state=Object.assign(clone(DEF),win);
      state.done=win.done||{}; state.notes=win.notes||{};
      state.tests=win.tests||{}; state.weights=win.weights||[]; state.plan=win.plan||{};
      state.v=2;
    }
    if(win&&win!==f) dirty=true;
    var useCap=(window.claude&&window.claude.use)?window.claude.use('artifact'):Promise.resolve(null);
    Promise.resolve(useCap).then(function(c){cap=c;render()},function(){render()});
    render();
  });
  render();
}
boot();
})();
</script>

/* Offline support. Progress itself lives in this browser's localStorage and
   needs no network at all -- this only caches the app shell. */
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
