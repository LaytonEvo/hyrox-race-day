name: Refresh pay-per-minute data

on:
  schedule:
    - cron: "17 6 * * *"   # daily, after the night's results settle
  workflow_dispatch:
  push:
    paths:
      - "pay-per-minute/wages.csv"
      - "pay-per-minute/build.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data.json from FPL minutes + wages.csv
        run: python3 pay-per-minute/build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add pay-per-minute/data.json
          git diff --cached --quiet || (git commit -m "Refresh pay-per-minute data" && git push)
